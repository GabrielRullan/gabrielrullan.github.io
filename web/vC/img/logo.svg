<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background with Chamfered Corners -->
  <rect x="6" y="6" width="116" height="116" rx="20" fill="url(#bgGrad)" stroke="#30363D" stroke-width="2.5" />

  <!-- Subtle Coordinate Grid Marks -->
  <line x1="64" y1="12" x2="64" y2="24" stroke="#30363D" stroke-width="1.5" stroke-dasharray="2 3" />
  <line x1="64" y1="104" x2="64" y2="116" stroke="#30363D" stroke-width="1.5" stroke-dasharray="2 3" />
  <line x1="12" y1="64" x2="24" y2="64" stroke="#30363D" stroke-width="1.5" stroke-dasharray="2 3" />
  <line x1="104" y1="64" x2="116" y2="64" stroke="#30363D" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Circuit Trace Lines -->
  <path d="M 28 32 L 40 32 L 48 40" fill="none" stroke="#21262D" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="28" cy="32" r="3" fill="#21262D" />

  <path d="M 98 94 L 86 94 L 80 88" fill="none" stroke="#21262D" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="98" cy="94" r="3" fill="#21262D" />

  <!-- Geometric Sigma & Circuit Vector Glyph -->
  <!-- Top bar of Sigma transitioning to circuit node -->
  <path d="M 92 34 L 38 34 L 66 64 L 38 94 L 92 94"
        fill="none"
        stroke="url(#cyanGrad)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowCyan)" />

  <!-- Inner Mathematical Kernel Beam -->
  <path d="M 66 64 L 98 64"
        fill="none"
        stroke="url(#amberGrad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-dasharray="6 3" />

  <!-- Coordinate Nodes / Bus Terminals -->
  <circle cx="38" cy="34" r="5" fill="#0B0F19" stroke="#00F2FE" stroke-width="3" />
  <circle cx="92" cy="34" r="5.5" fill="#00F2FE" />
  <circle cx="66" cy="64" r="4.5" fill="#F59E0B" />
  <circle cx="98" cy="64" r="5" fill="#F59E0B" />
  <circle cx="38" cy="94" r="5" fill="#0B0F19" stroke="#00F2FE" stroke-width="3" />
  <circle cx="92" cy="94" r="5.5" fill="#00F2FE" />

  <!-- Precision Crosshairs / Marker -->
  <path d="M 64 26 L 64 30 M 62 28 L 66 28" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 64 98 L 64 102 M 62 100 L 66 100" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
</svg>
