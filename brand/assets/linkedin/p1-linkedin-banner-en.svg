<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-label="Gabriel Rul-lan — LinkedIn Banner (P1)">
  <title>Gabriel Rul-lan — LinkedIn Banner (P1)</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)" />
  
  <!-- Right-side Decorative Brand Watermark -->
  <g transform="translate(1200, 48) scale(4.2)" opacity="0.12">
  <line x1="12" y1="68" x2="68" y2="68" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="12" y1="12" x2="12" y2="68" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="12" y1="40" x2="18" y2="40" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="40" y1="62" x2="40" y2="68" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 22,20 L 58,20 L 38,38 L 56,56 L 22,56 L 22,48 L 44,48 L 32,36 L 46,24 L 22,24 Z" fill="#FFFFFF"/>
  <circle cx="48" cy="24" r="3.5" fill="#FB923C"/>
  <circle cx="38" cy="38" r="3" fill="#FB923C"/>
</g>

  <!-- Main Content (Biased to x >= 380 to avoid avatar cut-out zone on LinkedIn) -->
  <g transform="translate(390, 0)">
    <!-- Role Subhead Pill -->
    <text x="0" y="82" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FB923C" letter-spacing="0.14em">DATA PARTNER · DATA STRATEGY, ANALYTICS &amp; AUTOMATION</text>
    
    <!-- Gabriel Rul-lan Name -->
    <text x="0" y="132" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">Gabriel Rul-lan</text>
    
    <!-- Primary Strategic Headline -->
    <text x="0" y="196" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC" letter-spacing="-0.01em">Data Strategy, Analytics &amp; Automation for Executive Teams</text>
    
    <!-- Supporting Mission Copy -->
    <text x="0" y="238" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="500" fill="#CBD5E1">Data governance, executive clarity, and trusted metrics without agency bloat · data-partner.xyz</text>
    
    <!-- Credential Trust Badges -->
    <g transform="translate(0, 278)">
      <rect x="0" y="0" width="220" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="#334155" stroke-width="1.2"/>
      <text x="110" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">Degree in Mathematics</text>
      
      <rect x="235" y="0" width="165" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="#334155" stroke-width="1.2"/>
      <text x="317" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">Executive MBA</text>
      
      <rect x="415" y="0" width="160" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="#334155" stroke-width="1.2"/>
      <text x="495" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">PMP® Certified</text>
    </g>
  </g>
</svg>