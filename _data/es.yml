about:
  title: Soy ...
  subtitle: '... ¡tu Partner de Datos!'
  paragraphs:
  - Soy Gabriel Rul-lan, un desarrollador con una década de experiencia en ingeniería
    de datos, análisis e inteligencia empresarial.
  - No estoy aquí solo para ofrecer servicios, sino para convertirme en tu Partner
    de Datos de confianza, entregando soluciones innovadoras de datos de principio
    a fin.
  - Mi objetivo es convertirme en el Partner de Datos de muchas empresas a las cuales
    las grandes firmas de consultoría realmente no tratarían con cuidado, pero que
    merecen la calidad de verdaderos expertos en datos.
questions:
  title: Preguntas, estoy seguro de que las tienes
  description:
  - Muchas empresas no tienen un Partner de Datos, y no saben qué utilidad podría
    tener para ellas
  - Aquí hay algunas preguntas que suelo recibir.
  items:
  - q: ¿Qué es un Partner de Datos?
    a: Un Partner de Datos va más allá del papel tradicional de un proveedor de servicios.
      Como tu Partner de Datos, actúo como una extensión de tu equipo realizando cualquier
      servicio de datos que puedas necesitar.
  - q: Suena a consultoría
    a: Las consultoras suelen intentar capturar clientes para convertirlos en un proyecto
      inacabable. Mi objetivo es crear sinergias con empresas mediante los proyectos
      que éstas necesiten.
  - q: Yo tengo pocos datos, no me interesa algo complicado
    a: Haremos una solución a medida, con la complejidad adaptada para tu empresa
      y tus datos.
  - q: ¿Cuál es el nombre de lo que estás vendiendo?
    a: No tengo una solución para venderte, trabajo con tus problemas y encuentro
      tu solución.
  - q: ¿Por qué no simplemente contratar internamente?
    a: 'Tiempo y dinero: para comenzar tu viaje de datos necesitarías contratar expertos
      y, tras montarlo todo, mantenerlos contigo.'
  - q: ¿Puedes darme un ejemplo?
    a: Piénsalo como si necesitaras una Oficina de Datos. Vendré, miraremos los requisitos,
      construiré tu oficina y te mostraré cómo mantenerla y usarla. Luego me mantendré
      en contacto si necesitas más cosas "grandes". Las operaciones y el día a día
      serán todos tuyos, sin dependencias adicionales.
  footer: ¿Quieres ver lo que tus datos pueden hacer por ti? ¡Ve a la sección de servicios!
