about:
  title: Sóc jo...
  subtitle: '... el teu Partner de Dades!'
  paragraphs:
  - Sóc Gabriel Rul-lan, un desenvolupador experimentat amb una dècada d'experiència
    en enginyeria de dades, creació de informes, anàlisi  intel·ligència empresarial.
  - No estic aquí només per oferir serveis, sinó per esdevenir el teu Partner de Dades
    de confiança, lliurant solucions de dades innovadores de principi a fi.
  - El meu objectiu és esdevenir el Partner de Dades de moltes empreses a les quals
    les grans firmes de consultoria realment no tractarien amb cura, però que mereixen
    la qualitat d'experts en dades.
questions:
  title: Preguntes, estic segur que les tens
  description:
  - Moltes empreses no tenen un Partner de Dades, i no saben quina utilitat podria
    tenir per a elles
  - Aquí hi ha algunes preguntes que solc rebre.
  items:
  - q: Què és un Partner de Dades?
    a: Un Partner de Dades és un proveïdor de serveis  i consultes  en totes les necessitats
      d'analítica o explotació de dades actuant com una extensió del teu equip.
  - q: Això no és consultoria?
    a: Les consultores sovint intenten capturar clients, no els interessen realcions
      si no sópn projectes llargs i costosos. Jo el que vull es crear sinèriges i
      sols projectes necessaris
  - q: Jo tinc poques dades, no vull res complicat
    a: Farem una solució a mida, amb el nivell de complexitat adaptat a la teva empresa.
  - q: Quin és el nom del que estic venent?
    a: No tinc una solució per vendre't, treballo amb els teus problemes i la teva  solució.
  - q: Per què no simplement contractar internament?
    a: 'Temps i doblers: per començar el teu viatge de dades necessitaries contractar
      experts, i un cop arrencat  mantenir-los amb tu.'
  - q: Pots donar-me un exemple?
    a: Pensa-ho com si necessitessis una Oficina de Dades. Vindré, mirarem els requisits,
      construiré la teva oficina i et mostraré com mantenir-la i utilitzar-la. Després
      simplement mantindré el contacte si necessites més coses "grans". Les operacions
      i el dia a dia seran tots teus, sense dependències addicionals.
  footer: Vols veure el que les teves dades poden fer per tu? Ves a la secció de serveis!
