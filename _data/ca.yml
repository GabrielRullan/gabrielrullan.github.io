services:
  title: Serveis
  description: Com a teu Partner de Dades, estic dedicat a transformar dades complexes
    en informació clara i accionable, assegurant el futur del teu negoci i adaptant
    solucions específicament per a tu. Explorarem com podem aprofitar les teves dades
    per impulsar el teu negoci endavant.
  items:
  - icon: bi bi-graph-up
    title: Simplificació de Dades
    desc: Transforma les dades en decisions. Unifica fonts de dades dispars en un
      sistema cohesionat amb eines d'informes avançades per informar-te i alertar-te
      sobre mètriques crítiques de negoci.
  - icon: bi bi-shield-lock
    title: Protegeix el Futur del Teu Negoci
    desc: Mantén-te per davant de les corbes tecnològiques, assegurant que el teu
      negoci s'adapta sense problemes als avenços sense l'esforç de mantenir-se al
      dia amb la cursa tecnològica.
  - icon: bi bi-toggles2
    title: Solucions Personalitzades
    desc: Obtén exactament el que necessites, sense excessos. Projectes dissenyats
      per adaptar-se al teu flux de treball, assegurant comoditat i facilitat d'ús
      sense forçar canvis dràstics.
  - icon: bi bi-gem
    title: Descobreix el teu potencial
    desc: Descobreix les fortaleses i oportunitats clau dins les teves dades per impulsar
      el teu negoci endavant, centrant-te en el creixement sostenible i en perspectives
      estratègiques.
  - icon: bi bi-briefcase
    title: Redueix Riscos, Estalvia Diners
    desc: Aprofita decisions informades per minimitzar riscos i costos. Un millor
      maneig de les teves dades significa estalviar diners evitant contratemps imprevistos.
  - icon: bi bi-lightbulb
    title: Generació de noves Perspectives
    desc: Utilitza les teves dades com una bola de cristall per predir i preparar-te
      per a les tendències futures. La nostra analítica converteix les dades en una
      eina visionària per al teu negoci.
testimonials:
  title: Testimonis
  description: En més de 10 anys treballant, he col·laborat exitosament amb molta
    gent, aquestes són algunes d'aquestes meravelloses persones.
  items:
  - text: Les seves habilitats i ètica de treball són encomiables i han contribuït
      significativament a l'èxit dels nostres projectes.
    name: Jacob Kratzsch
    role: CEO & Fundador
  - text: Gabriel és un actiu valuós per a qualsevol equip de ciència de dades i estic
      segur que excel·lirà en qualsevol futur emprenedoria.
    name: Ayo Ayedefa
    role: Cap de BI
  - text: Gabriel és una de les persones més dedicades, pacients e innovadores amb
      les quals he tingut el plaer de treballar en qualsevol capacitat.
    name: Xialu Zheng
    role: Científic de Dades Júnior
  - text: La seva expertesa va ser clau en la construcció de la nostra plataforma
      des de zero, impulsant-nos per davant del calendari gràcies al seu compromís
      i habilitat.
    name: Arjun Katyal
    role: Cap d'Auditories Internes
  - text: Va transformar el nostre conjunt de dades, millorant la presa de decisions
      i l'eficiència amb la seva expertesa.
    name: Ash
    role: Founder
