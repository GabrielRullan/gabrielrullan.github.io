about:
  title: It's me...
  subtitle: '... your Data Partner!'
  paragraphs:
  - I'm Gabriel Rul-lan, a seasoned developer with a decade of experience in data
    engineering, analysis, and business intelligence.
  - I'm here not just to offer services, but to become your trusted Data Partner,
    delivering end-to-end innovative data solutions.
  - My aim is to become the Data Partner of many companies to whom it doesn't big
    consulting firms wouldn't really treat with care, but that deserve the quality
    of real data experts.
questions:
  title: Questions, I'm sure you have them
  description:
  - Many companies don't have a Data Partner, and they don't know what use it will
    be for them
  - Here are some questions I usually get.
  items:
  - q: What is a Data Partner?
    a: A Data Partner goes beyond the traditional role of a service provider. As your
      Data Partner, I act as an extension of your team, deeply invested in your success.
  - q: Is this not consulting?
    a: Consulting firms often try to capture clients, they are not interested in relationships
      unless they are long and expensive projects. What I want is to create synergies
      and only necessary projects.
  - q: I have limited data, I don't want anything complicated
    a: We will create a customized solution, with the level of complexity adapted
      to your company.
  - q: What is the name of what I am selling?
    a: I don't have a solution to sell you, I work with your problems and find your
      solution.
  - q: Why not just hire internally, if data is so important?
    a: It is not worth it to have a whole data team in-house, but to begin your data
      journey you'd need to hire experts, and then keep them with you.
  - q: Can you give me an example?
    a: Think of it like you needing a Data Office. I will come, get the requirements,
      build you office, show you how to mantain it and use it and then just stay in
      touch if you need more "big" things. The operations and day to day will be all
      yours, no extra dependencies.
  footer: You want to see what your data can do for you, go to the services section!
