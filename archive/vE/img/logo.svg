<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="Gabriel Rul-lan | Fractional Data Partner Logo">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A5C36" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0A5C36" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Collaborative Data Partner Mark: Interconnected Infinity / 'dp' Loop -->
  <g transform="translate(6, 8)" filter="url(#subtleShadow)">
    <!-- Emerald Loop: Representing Data Foundation & Growth -->
    <path d="M 22,24 C 14,24 8,18 8,11 C 8,4 14,-2 22,-2 C 32,-2 38,10 44,14 C 40,20 32,24 22,24 Z" 
          transform="translate(0, 13)"
          fill="url(#emeraldGrad)" />
    
    <!-- Coral Loop: Representing Partnership, Human Touch & Agility -->
    <path d="M 26,24 C 36,24 42,18 42,11 C 42,4 36,-2 26,-2 C 16,-2 10,10 4,14 C 8,20 16,24 26,24 Z" 
          transform="translate(18, 13)"
          fill="url(#coralGrad)" />

    <!-- Overlapping Intersection & Data Point Nodes -->
    <circle cx="35" cy="24" r="4.5" fill="#FFFFFF" />
    <circle cx="35" cy="24" r="3" fill="#0A5C36" />
    <circle cx="16" cy="24" r="3" fill="#FFFFFF" />
    <circle cx="16" cy="24" r="1.8" fill="#15803D" />
    <circle cx="54" cy="24" r="3" fill="#FFFFFF" />
    <circle cx="54" cy="24" r="1.8" fill="#EA580C" />
  </g>

  <!-- Wordmark Typography -->
  <g transform="translate(80, 0)">
    <text x="0" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#1F2937" letter-spacing="-0.02em">
      Gabriel Rul-lan
    </text>
    <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0A5C36" letter-spacing="0.14em">
      PARTNER DE DATOS
    </text>
    <!-- Subtle pill dot -->
    <circle cx="160" cy="41" r="2.5" fill="#F97316" />
  </g>
</svg>
