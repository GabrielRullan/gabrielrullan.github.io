<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="520" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Crest Shield Icon -->
  <g transform="translate(6, 6)" filter="url(#subtleGlow)">
    <!-- Outer Shield Border -->
    <path d="M34 2 L62 10 C62 44 48 58 34 66 C20 58 6 44 6 10 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Inner Governance Grid Pattern -->
    <path d="M18 20 L50 20 M18 32 L50 32 M18 44 L50 44" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.65"/>
    <path d="M26 14 L26 50 M42 14 L42 50" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.65"/>

    <!-- Central Governance Core Node -->
    <circle cx="34" cy="32" r="2.5" fill="url(#goldGrad)" opacity="0.8"/>
    
    <!-- Monogram: Architectural 'G' and 'R' Interlock -->
    <!-- Stylized 'G' -->
    <path d="M33 22 C23 22 17 27 17 34 C17 41 23 46 33 46 C39 46 43 43 45 38 L33 38" 
          stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Stylized 'R' Stem and Bowl -->
    <path d="M30 22 L30 46" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M30 22 C37 22 43 24 43 29 C43 33 38 35 30 35 L44 46" 
          stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Seal Accent Points -->
    <polygon points="34,6 36,9 34,12 32,9" fill="url(#goldGrad)"/>
    <circle cx="34" cy="60" r="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Brand Lockup -->
  <!-- Primary Title: Cormorant / Playfair Style Classical Serif -->
  <text x="84" y="38" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
        font-size="24" 
        font-weight="700" 
        letter-spacing="0.12em" 
        fill="#0F172A">
    GABRIEL RUL-LAN
  </text>

  <!-- Subtitle: Governance & Authority Descriptor -->
  <text x="85" y="55" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="9.5" 
        font-weight="700" 
        letter-spacing="0.22em" 
        fill="#B45309">
    ENTERPRISE DATA GOVERNANCE &amp; IT PM
  </text>

  <!-- Institutional Quality Mark -->
  <text x="85" y="68" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="8.5" 
        font-weight="500" 
        letter-spacing="0.14em" 
        fill="#64748B">
    PMP® CERTIFIED · DAMA-DMBOK PRACTITIONER · EX-ASTRAZENECA LEAD
  </text>
</svg>
