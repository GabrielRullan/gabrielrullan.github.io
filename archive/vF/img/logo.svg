<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="Gabriel Rul-lan | Dirección de Datos &amp; Estrategia Logo">
  <defs>
    <!-- Paleta Institucional: Verde Esmeralda Forestal y Coral Cálido -->
    <linearGradient id="vfEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A5C36" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="vfEmeraldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#074528" />
      <stop offset="100%" stop-color="#0A5C36" />
    </linearGradient>
    <linearGradient id="vfCoralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="vfSoftShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0A5C36" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Isotipo: Rigor Matemático & Alianza Estratégica (Arquitectura Vectorial Limpia) -->
  <g transform="translate(8, 7)" filter="url(#vfSoftShadow)">
    <!-- Base estructural: Vector ascendente de precisión matemática -->
    <path d="M 6,38 L 22,8 C 23.5,5 26.5,5 28,8 L 44,38 C 45,40 43.5,42 41,42 L 34,42 C 32,42 30.5,40.8 29.8,39 L 25,28 L 20.2,39 C 19.5,40.8 18,42 16,42 L 9,42 C 6.5,42 5,40 6,38 Z"
          fill="url(#vfEmeraldGrad)" />

    <!-- Arco envolvente: Alianza estratégica y acompañamiento directivo -->
    <path d="M 14,24 C 14,14 22,6 32,6 C 42,6 50,14 50,24 C 50,34 42,42 32,42 C 29,42 26.5,41.2 24.2,40 C 23,39.4 22.5,38 23.2,36.8 C 24,35.6 25.4,35.2 26.6,35.8 C 28.2,36.6 30,37 32,37 C 39.2,37 45,31.2 45,24 C 45,16.8 39.2,11 32,11 C 24.8,11 19,16.8 19,24 C 19,26.5 19.8,28.8 21.2,30.6 C 22,31.7 21.7,33.2 20.6,34 C 19.5,34.8 18,34.5 17.2,33.4 C 15.2,30.7 14,27.5 14,24 Z"
          fill="url(#vfEmeraldAccent)"
          opacity="0.95" />

    <!-- Vértice dinámico en Coral: Foco en rentabilidad, visión humana y decisión -->
    <path d="M 25,12 L 31,23 L 19,23 Z"
          fill="url(#vfCoralGrad)" />

    <!-- Punto focal directivo: Síntesis de datos e indicador clave -->
    <circle cx="25" cy="20" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Tipografía Corporativa / Wordmark Directivo -->
  <g transform="translate(74, 0)">
    <!-- Nombre Titular -->
    <text x="0" y="28"
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
          font-size="20"
          font-weight="800"
          fill="#1F2937"
          letter-spacing="-0.025em">
      Gabriel Rul-lan
    </text>

    <!-- Subtítulo Institucional Directivo -->
    <text x="0" y="46"
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
          font-size="10"
          font-weight="700"
          fill="#0A5C36"
          letter-spacing="0.13em">
      DIRECCIÓN DE DATOS &amp; ESTRATEGIA
    </text>

    <!-- Acento geométrico en Coral cálido -->
    <circle cx="218" cy="42.5" r="2.2" fill="#F97316" />
  </g>
</svg>
